<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Checkout — Guadaluz</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    #checkoutForm input:not([type="checkbox"]),
    #checkoutForm select {
      width: 100%;
      box-sizing: border-box;
      height: 48px;
      border-radius: 12px;
      border: 1.5px solid rgba(45,31,31,.10);
      background: rgba(45,31,31,.03);
      padding: 0 14px;
      font-size: 14px;
      color: #2d1f1f;
      outline: none;
    }
    #checkoutForm input:focus,
    #checkoutForm select:focus {
      border-color: #2d1f1f;
      box-shadow: 0 0 0 3px rgba(45,31,31,.08);
    }
    #checkoutForm label {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      color: rgba(45,31,31,.6);
    }
    #coAddressWrap {
      display: grid;
      grid-template-columns: 80px 1fr;
      gap: 8px;
    }
    #coAddrPostal, #coAddrCity {
      grid-column: span 1;
    }
    @media (max-width: 480px) {
      #coAddressWrap {
        grid-template-columns: 1fr;
      }
    }
    #coGcCode { height: 44px !important; }
  </style>
  <script>
    window.__API_BASE__ = "https://backendmaisoncire.onrender.com";
  </script>
</head>
<body>

  <main class="container" style="max-width:900px;margin:40px auto;padding:0 16px;">
    <h1>Finaliser la commande</h1>

    <section class="card" style="padding:16px;margin-top:16px;">
      <h3>Récapitulatif</h3>
      <div id="checkoutRecap" class="muted" style="margin-top:10px;"></div>
      <div style="margin-top:12px;">
        <strong>Total :</strong> <span id="checkoutTotal">—</span>
      </div>
    </section>

    <section class="card" style="padding:16px;margin-top:16px;">
      <h3>Informations</h3>

      <form id="checkoutForm" style="display:grid;gap:10px;margin-top:12px;">
        <!-- honeypot : invisible pour les humains, rempli par les bots -->
        <input id="coWebsite" name="website" type="text" tabindex="-1" autocomplete="off"
          style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0;pointer-events:none;" aria-hidden="true" />
        <input id="coEmail" type="email" placeholder="Email" required />
        <input id="coPhone" type="tel" placeholder="Téléphone (optionnel)" />

        <label>
          Mode de livraison
          <select id="coDelivery" required>
            <option value="pickup">Retrait en magasin</option>
            <option value="shipping">Envoi à domicile</option>
          </select>
        </label>

        <div id="coAddressWrap" style="display:none; gap:10px;">
          <input id="coAddrNumber" placeholder="Numéro" />
          <input id="coAddrStreet" placeholder="Rue" />
          <input id="coAddrPostal" placeholder="Code postal" />
          <input id="coAddrCity" placeholder="Ville" />
        </div>

        <label>
          Mode de paiement
          <select id="coPayment" required>
            <option value="transfer">Virement</option>
            <option value="cash">Cash en magasin</option>
          </select>
        </label>

        <div id="coPayHint" class="muted"></div>

        <!-- Code cadeau -->
        <div id="gcSection" style="border:1px solid rgba(201,168,67,.30);border-radius:14px;padding:16px;background:rgba(201,168,67,.05);">
          <p style="margin:0 0 10px;font-weight:700;font-size:14px;">🎁 Code cadeau</p>
          <div style="display:flex;gap:8px;">
            <input id="coGcCode" type="text" placeholder="MC-XXXX-XXXX-XXXX"
              style="flex:1;height:44px;border-radius:10px;border:1.5px solid rgba(0,0,0,.12);background:#fff;padding:0 12px;font-size:14px;text-transform:uppercase;letter-spacing:.06em;" />
            <button type="button" id="coGcApply" class="btn" style="white-space:nowrap;">Appliquer</button>
          </div>
          <p id="coGcMsg" style="margin:8px 0 0;font-size:13px;"></p>
          <div id="coGcApplied" style="display:none;margin-top:10px;padding:10px 14px;background:rgba(74,108,88,.10);border-radius:10px;display:none;">
            <strong id="coGcAppliedLabel" style="color:#2d6a4f;font-size:14px;"></strong>
          </div>
        </div>

        <div style="display:flex;align-items:flex-start;gap:10px;background:#fdf0ec;border:1px solid rgba(45,31,31,.12);border-radius:14px;padding:14px 16px;margin-top:6px;">
          <span style="font-size:16px;flex-shrink:0;margin-top:1px;">ℹ️</span>
          <p style="margin:0;font-size:13px;line-height:1.6;color:#2d1f1f;">
            <strong>Traitement après paiement</strong><br>
            Votre commande sera préparée et expédiée uniquement après réception de votre paiement. Aucunes commandes sera expédié avant réception du paiement.
          </p>
        </div>

        <label style="display:flex;align-items:flex-start;gap:10px;cursor:pointer;padding:4px 0;">
          <input type="checkbox" id="coCgv" required
            style="margin-top:3px;flex-shrink:0;width:16px;height:16px;accent-color:#2d1f1f;cursor:pointer;" />
          <span style="font-size:13px;line-height:1.6;color:#2d1f1f;">
            J'ai lu et j'accepte les
            <a href="legal.html#cgv" target="_blank" style="color:#2d1f1f;font-weight:700;text-decoration:underline;">Conditions Générales de Vente</a>,
            notamment les conditions de retour et la politique de remboursement.
          </span>
        </label>

        <button type="submit" class="btn btn--primary" style="margin-top:4px;">Confirmer la commande</button>
        <div id="coMsg" class="muted"></div>
      </form>
    </section>
  </main>

  <script src="auth.js" defer></script>
  <script src="checkout.js" defer></script>
</body>
</html>
