<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Maison Cire — Mon compte</title>
  <link rel="stylesheet" href="styles.css" />
  <!-- Supabase JS (needed because app.js uses window.supabase for Storage uploads) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <header class="header">
    <div class="brand">
      <span class="brandDot"></span>
      <span class="brandText">Maison Cire</span>
    </div>

    <nav class="nav" id="nav" aria-label="Navigation">
      <a href="index.html">Retour a l'accueil</a>
    </nav>

    <div class="headerActions">
      <button id="hamburger" class="hamburger" aria-label="Menu" aria-expanded="false" type="button">
        <span class="hamburger__bars" aria-hidden="true"></span>
      </button>
    </div>
  </header>


  <main class="main">
    <section class="section reveal" id="account">
      <div class="section__head">
        <h2>Mon compte</h2>
        <p class="muted" id="accountSubtitle">Connexion / Inscription</p>
      </div>

      <!-- ✅ NOT LOGGED: tabs login/signup -->
      <div id="authBox" class="adminBox">
        <div class="row" style="display:flex; gap:10px; flex-wrap:wrap;">
          <button type="button" class="btn" id="tabLogin">Se connecter</button>
          <button type="button" class="btn btn--ghost" id="tabSignup">S'inscrire</button>
        </div>

        <div style="margin-top:12px;" id="authForms">
          <!-- Login -->
          <form id="loginForm" class="adminForm">
            <label class="tiny muted">Email</label>
            <input class="input" type="email" id="loginEmail" placeholder="email@exemple.com" required />

            <label class="tiny muted" style="margin-top:10px;">Mot de passe</label>
            <input class="input" type="password" id="loginPassword" placeholder="Entrez votre mot de passe" required />

            <div style="margin-top:12px; display:flex; gap:10px; align-items:center;">
              <button class="btn" type="submit">Connexion</button>
              <span class="tiny muted" id="loginMsg"></span>
            </div>
          </form>

          <!-- Signup -->
          <form id="signupForm" class="adminForm" style="display:none;">
            <label class="tiny muted">Email</label>
            <input class="input" type="email" id="signupEmail" placeholder="email@exemple.com" required />

            <label class="tiny muted" style="margin-top:10px;">Mot de passe</label>
            <input class="input" type="password" id="signupPassword" placeholder="Créez votre mot de passe" required />

            <div style="margin-top:12px; display:flex; gap:10px; align-items:center;">
              <button class="btn" type="submit">Créer mon compte</button>
              <span class="tiny muted" id="signupMsg"></span>
            </div>
          </form>
        </div>
      </div>

      <!-- ✅ LOGGED: user header -->
      <div id="accountBox" class="adminBox" style="display:none;">
        <div style="display:flex; justify-content:space-between; gap:12px; align-items:center; flex-wrap:wrap;">
          <div>
            <div class="tiny muted">Connecté en tant que</div>
            <div><strong id="accountEmail">—</strong> <span class="tiny muted" id="accountRole"></span></div>
          </div>
          <button type="button" class="btn btn--ghost" id="logoutBtn">Se déconnecter</button>
        </div>
      </div>
    </section>

    <!-- ✅ USER: orders list (linked to email) -->
    <section class="section reveal" id="myOrders" style="display:none;">
      <div class="section__head">
        <h2>Mes commandes</h2>
        <p class="muted">Historique lié à votre email.</p>
      </div>
      <div class="adminBox">
        <div id="myOrdersMsg" class="tiny muted">Chargement...</div>
        <div id="myOrdersList" style="margin-top:10px;"></div>
      </div>
    </section>

     <!-- Admin -->
    <section class="section reveal" id="admin">
      <div class="section__head">
        <h2>Admin</h2>
        <p class="muted">Gestion produits (démo)</p>
      </div>

      <div class="adminBox">
        <div id="adminAuth">
          <div class="row" style="display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
            <label class="label" style="min-width:240px;">
              Code admin
              <input id="adminCode" type="password" placeholder="admin123" />
            </label>
            <button class="btn btn--primary" id="adminLogin" type="button">Connexion</button>
          </div>
          <p class="formMsg" id="adminMsg" role="status" aria-live="polite"></p>
        </div>

        <div id="adminPanel" class="hidden">
          <div class="row" style="display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end;">
            <label class="label" style="min-width:240px;">
              Produit
              <select id="adminSelect"></select>
            </label>
            <button id="adminDelete" class="btn btn--danger" type="button">Supprimer le produit</button>
          </div>

          <div class="adminForm">
            <label class="label">
              Nom
              <input id="adminName" type="text" />
            </label>

            <label class="label">
              Prix (€)
              <input id="adminPrice" type="number" step="0.01" min="0" />
            </label>

            <label class="label">
              Stock
              <input id="adminStock" type="number" step="1" min="0" />
            </label>

            <label class="label">
              Description
              <textarea id="adminDesc" rows="3"></textarea>
            </label>
          </div>

          <!-- Admin: actions -->
<div class="adminActions">
  <button id="adminAddOpen" class="btn" type="button">+ Ajouter un produit</button>
  <p class="tiny muted" id="adminAddMsg" style="margin:8px 0 0;"></p>
</div>


<!-- Admin: modal add product -->
<div class="modal" id="adminAddModal" aria-hidden="true">
  <div class="modal__overlay" data-admin-add-close></div>

  <div class="modal__panel" role="dialog" aria-modal="true" aria-label="Ajouter un produit">
    <div class="modal__head">
      <h3 style="margin:0;">Ajouter un produit</h3>
      <button class="iconBtn" type="button" data-admin-add-close aria-label="Fermer">✕</button>
    </div>

    <form id="adminAddForm" class="modal__body">
      <div class="formGrid">
        <label class="field" style="display: none;">
          <span>ID (unique) *</span>
          <input id="adminAddId" />
          <small class="tiny muted">Sans espace, ex: “bougie-vanille”.</small>
        </label>

        <label class="field">
          <span>Nom *</span>
          <input id="adminAddName" required placeholder="Bougie Vanille" />
        </label>

        <label class="field">
          <span>Prix (€) *</span>
          <input id="adminAddPrice" type="number" step="0.01" min="0" required placeholder="18.90" />
        </label>

        <label class="field">
          <span>Stock *</span>
          <input id="adminAddStock" type="number" step="1" min="0" required placeholder="12" />
        </label>

       <label class="field" style="grid-column:1/-1;">
  <span>Image</span>

  <div class="imgPicker">
    <button class="btn btn--ghost" type="button" id="adminImgBtn">+ Ajouter une image</button>
    <input id="adminImgFile" type="file" accept="image/*" hidden />
    <img id="adminImgPreview" style="display:none; width:20%; border-radius:12px; margin-top:10px;" />
    <span class="tiny muted" id="adminImgStatus">Aucune image</span>
  </div>

  <input id="adminAddImage" placeholder="URL générée automatiquement..." readonly />
</label>


        <label class="field" style="grid-column:1/-1;">
          <span>Description</span>
          <textarea id="adminAddDescription" rows="3" placeholder="Une description courte..."></textarea>
        </label>
      </div>

      <div class="adminAddFooter">
        <button class="btn btn--ghost" type="button" data-admin-add-close>Annuler</button>
        <button class="btn" id="adminAddSubmit" type="submit">Créer</button>
      </div>

      <p class="tiny" id="adminAddFormMsg" style="margin:10px 0 0;"></p>
    </form>
  </div>
</div>


          <!-- Admin Reviews -->
          <div class="adminReviews" style="margin-top:18px;">
            <h3 style="margin:0 0 10px;">Avis du produit</h3>

            <div class="row" style="display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
              <p class="muted" style="margin:0;">
                Total : <strong id="adminReviewsCount">0</strong> · Moyenne : <strong id="adminReviewsAvg">0,0</strong>/5
              </p>
              <button class="btn btn--ghost" id="adminReviewsClear" type="button">Supprimer tous les avis</button>
            </div>

            <div id="adminReviewsList" style="margin-top:12px;"></div>
            <p class="formMsg" id="adminReviewsMsg" role="status" aria-live="polite"></p>
          </div>

          <section class="adminCard" id="adminOrdersCard">
            <h3>Commandes</h3>

            <div class="tiny muted" id="adminOrdersMsg"></div>

            <div id="adminOrdersList" class="adminOrdersList"></div>

            <div style="display:flex; gap:10px; align-items:center; margin-bottom:10px;">
              <button id="adminToggleFinished" class="btn btn--ghost">
                Voir les commandes terminées
              </button>
              <span id="adminOrdersMode" class="tiny muted">
                Commandes en cours
              </span>
            </div>


            <div id="adminOrderDetail" class="adminOrderDetail hidden"></div>

            
          </section>


          <div class="row" style="display:flex; gap:10px; flex-wrap:wrap; margin-top:12px;">
            <button class="btn btn--primary" id="adminSave" type="button">Sauvegarder les modifications</button>
            <p class="formMsg" id="adminSaveMsg" role="status" aria-live="polite"></p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>window.__PAGE__ = "account"</script>

 <script src="auth.js" defer></script>
<script src="app.js" defer></script>
<script src="account.js" defer></script>

</body>
</html>
